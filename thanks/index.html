<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks for voting | KickStartYou</title>
<style>
  :root { --dark: #4b1e78; --light: #a98bdc; --bg: #f4f0fa; --text: #1a1a1a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; padding: 16px; }
  .card { background: #fff; max-width: 480px; width: 100%; border-radius: 10px; padding: 36px 28px; text-align: center;
          box-shadow: 0 2px 12px rgba(75, 30, 120, 0.08); }
  .logo { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo .you { color: var(--dark); }
  .bar { height: 8px; background: var(--light); margin: 10px auto 28px; max-width: 220px; border-radius: 2px; }
  h1 { color: var(--dark); font-size: 26px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.6; margin: 0 0 24px; }
  .btn { display: inline-block; background: var(--dark); color: #fff; text-decoration: none; font-weight: bold;
         padding: 13px 24px; border-radius: 6px; font-size: 16px; }
  .btn:hover, .btn:focus { background: #3a165e; }
  .small { font-size: 14px; color: #555; margin: 20px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <img src="../logo.png" alt="KickStartYou" width="240" style="display:block;margin:0 auto 24px;width:240px;max-width:100%;height:auto;">
    <h1>Thanks, your vote's counted!</h1>
    <p>I'll share the results in a future edition of The Weekly Kick.</p>
    <p style="margin-bottom:12px;">For faster updates during the week:</p>
    <a class="btn" href="https://whatsapp.com/channel/0029VbEMesjEquiK8Z1TzF3m">Follow the WhatsApp Channel</a>
    <p class="small">You can close this page now.</p>
  </main>
</body>
</html>
